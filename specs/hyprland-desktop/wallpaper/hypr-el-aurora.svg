<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- hypr-el "Aurora" wallpaper, MIT licensed, part of hyprland-el -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1a"/>
      <stop offset="0.55" stop-color="#11132a"/>
      <stop offset="1" stop-color="#090a14"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33ccff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#33ccff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#00e0a8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#00e0a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="140"/></filter>
    <filter id="thin" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="48" cy="48" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <ellipse cx="900" cy="700" rx="1300" ry="800" fill="url(#glow1)"/>
  <ellipse cx="3050" cy="1500" rx="1400" ry="900" fill="url(#glow2)"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- aurora ribbons -->
  <path d="M -200 1500 C 700 900, 1500 1700, 2300 1100 S 3600 700, 4100 1000"
        stroke="url(#ribbonA)" stroke-width="260" fill="none" filter="url(#softer)"/>
  <path d="M -200 1500 C 700 900, 1500 1700, 2300 1100 S 3600 700, 4100 1000"
        stroke="url(#ribbonA)" stroke-width="70" fill="none" filter="url(#soft)"/>
  <path d="M -200 1500 C 700 900, 1500 1700, 2300 1100 S 3600 700, 4100 1000"
        stroke="url(#ribbonA)" stroke-width="5" fill="none" filter="url(#thin)" opacity="0.9"/>

  <path d="M -200 1750 C 900 1300, 1700 2000, 2600 1450 S 3700 1150, 4100 1350"
        stroke="url(#ribbonB)" stroke-width="220" fill="none" filter="url(#softer)"/>
  <path d="M -200 1750 C 900 1300, 1700 2000, 2600 1450 S 3700 1150, 4100 1350"
        stroke="url(#ribbonB)" stroke-width="50" fill="none" filter="url(#soft)"/>
  <path d="M -200 1750 C 900 1300, 1700 2000, 2600 1450 S 3700 1150, 4100 1350"
        stroke="url(#ribbonB)" stroke-width="4" fill="none" filter="url(#thin)" opacity="0.8"/>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="420" cy="260" r="2.2" opacity="0.5"/><circle cx="1180" cy="180" r="1.6" opacity="0.4"/>
    <circle cx="1720" cy="420" r="2.4" opacity="0.55"/><circle cx="2380" cy="230" r="1.8" opacity="0.4"/>
    <circle cx="2960" cy="380" r="2.6" opacity="0.6"/><circle cx="3480" cy="160" r="1.7" opacity="0.45"/>
    <circle cx="3300" cy="640" r="1.5" opacity="0.35"/><circle cx="640" cy="560" r="1.4" opacity="0.35"/>
    <circle cx="2100" cy="640" r="1.6" opacity="0.4"/><circle cx="2700" cy="820" r="1.3" opacity="0.3"/>
    <circle cx="1450" cy="820" r="1.2" opacity="0.3"/><circle cx="200" cy="900" r="1.6" opacity="0.35"/>
  </g>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
