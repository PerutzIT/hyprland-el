# hyprland-el lock screen (system default, /etc/xdg/hypr/hyprlock.conf).
# Your own ~/.config/hypr/hyprlock.conf takes precedence.

$font = JetBrains Mono
$accent = rgba(33ccffee)
$accent2 = rgba(00e0a8ee)
$text = rgba(e6e9f5ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/backgrounds/hypr-el/hypr-el-aurora.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 110
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    color = rgba(e6e9f5cc)
    font_size = 22
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent $accent2 45deg
    inner_color = rgba(11132acc)
    font_color = $text
    check_color = rgba(00e0a8ee) rgba(33ccffee) 120deg
    fail_color = rgba(ff5577ee) rgba(ff0066ee) 40deg
    fade_on_empty = false
    rounding = 28
    font_family = $font
    placeholder_text = <i>Passwort / password …</i>
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(e6e9f5aa)
    font_size = 16
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(e6e9f588)
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
