# hyprland-el fallback lock screen (/etc/xdg/hypr/hyprlock.conf). In a
# hyprland-el session hypr-el-lock uses ~/.config/hypr-el/hyprlock.conf.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/backgrounds/hypr-el/hypr-el-default.png
    blur_passes = 3
    brightness = 0.65
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2ed9)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fade_on_empty = false
    rounding = 12
    placeholder_text = Passwort
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}
