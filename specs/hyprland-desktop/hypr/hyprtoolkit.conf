# hyprland-el theme for hyprtoolkit apps (hyprlauncher, hyprshutdown,
# hyprland-welcome, hyprpwcenter, hyprsysteminfo, share picker, ...).
# System default, /etc/xdg/hypr/hyprtoolkit.conf. Your own
# ~/.config/hypr/hyprtoolkit.conf takes precedence. Colors are 0xAARRGGBB.
background = 0xF00D0F20
base = 0xFF14172E
alternate_base = 0xFF1B1E38
text = 0xFFE6E9F5
bright_text = 0xFFFFFFFF
link_text = 0xFF33CCFF
accent = 0xFF00E0A8
accent_secondary = 0xFF33CCFF
rounding_large = 14
rounding_small = 8
font_family = Noto Sans
font_family_monospace = JetBrains Mono
font_size = 11
icon_theme = Papirus-Dark
